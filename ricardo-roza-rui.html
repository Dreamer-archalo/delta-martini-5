const code=document.getElementById('access-code');
const button=document.getElementById('access-button');
const message=document.getElementById('access-error');
function decodeBase64(value){return Uint8Array.from(atob(value),character=>character.charCodeAt(0));}
code.addEventListener('input',()=>{message.textContent='';code.removeAttribute('aria-invalid');});
form.addEventListener('submit',async event=>{
 event.preventDefault();
